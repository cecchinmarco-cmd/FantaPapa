<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#103c30"><title>FantaPapa 26-27</title><style>
:root{color-scheme:light;--green:#103c30;--gold:#f2d477;--ink:#18382e;--muted:#596b63;--paper:#f4f5ef;--line:#dce3db}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}button{font:inherit;cursor:pointer}header{background:var(--green);color:white} .bar{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:850;font-size:22px;letter-spacing:-.7px}.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid #87a899;border-radius:12px;color:var(--gold);font-size:26px}.season{display:block;font-size:11px;letter-spacing:1.6px;color:#c4d7cb;font-weight:600}.menuBtn{border:1px solid #8da99d;border-radius:10px;color:white;background:transparent;padding:10px 14px;min-height:44px}.shell{max-width:1160px;margin:auto;padding:24px 20px 110px}.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#103c30,#205d46);color:white;border-radius:24px;padding:26px;min-height:240px}.hero:after{content:'';position:absolute;width:220px;height:320px;border:2px solid #ffffff18;right:-75px;top:-30px;transform:rotate(24deg);border-radius:12px;pointer-events:none}.hero>*{position:relative;z-index:1}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-1.6px;margin:14px 0}.hero p{color:#d6e6dd;margin:8px 0 20px}.primary{display:inline-flex;min-height:48px;align-items:center;background:var(--gold);color:#163b2d;border:0;border-radius:12px;padding:12px 20px;text-decoration:none;font-weight:800}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 12px}.sectionhead h2{font-size:21px;margin:0;letter-spacing:-.5px}.sectionhead a{font-size:14px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:105px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;font-weight:750}.tile span{font-size:23px;color:#27664d}.tile small{font-weight:450;color:var(--muted);font-size:12px}.notice{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom a,.bottom button{flex:1;text-align:center;font-size:11px;font-weight:650;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);border:0;background:transparent;min-height:48px}.bottom span{font-size:21px;line-height:1.2}.bottom [aria-current=page]{color:var(--green);font-weight:850}.drawer{background:white;border-bottom:1px solid var(--line);padding:16px 20px;color:var(--ink)}.drawer-inner{max-width:1160px;margin:auto;display:grid;gap:18px}.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 6px}.drawer a{display:block;text-decoration:none;padding:10px;border-radius:8px;font-weight:650}.drawer a:hover,.drawer a[aria-current=page]{background:#e4eee6}.page-title{font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-1px}.subtle{color:var(--muted)}[hidden]{display:none!important}footer{text-align:center;font-size:12px;color:var(--muted);margin-top:30px}a:focus-visible,button:focus-visible{outline:3px solid #b48717;outline-offset:3px}@media(min-width:760px){.shell{padding:36px 28px 70px}.bar{padding:20px 28px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.drawer-inner{grid-template-columns:repeat(4,1fr)}.hero{padding:40px;min-height:270px}.bottom{display:none}}@media(max-width:359px){.shell{padding-left:12px;padding-right:12px}.tile{padding:12px}.brand{font-size:19px}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}.filters label{font-size:13px;font-weight:700}.filters select{display:block;width:100%;min-height:46px;font:inherit;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink)}.round{margin:24px 0}.round small{color:var(--muted);text-align:right}.match{background:white;border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:14px}.matchline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.matchline strong:last-child{text-align:right}.matchline b{background:#e7efe8;padding:5px 12px;border-radius:8px;font-size:19px}.matchpoints{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.tablewrap{overflow:auto;margin:18px 0;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;background:white;white-space:nowrap;width:100%;font-variant-numeric:tabular-nums}th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--line)}th{background:#e7efe8;font-size:12px}td:nth-child(2),th:nth-child(2){position:sticky;left:0;background:#fff;text-align:left;font-weight:700}th:nth-child(2){background:#e7efe8}td:nth-child(3){font-weight:800}.accessform{display:grid;gap:16px;max-width:420px}.accessform label{display:grid;gap:6px;font-weight:700}.accessform input{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}.accessform button{justify-content:center}.accessform button:disabled{opacity:.5}.moduleRow{display:grid;grid-template-columns:32px 1fr 48px 48px;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:7px 0}.moduleRow button{min-height:44px;background:#e7efe8;border:0;border-radius:9px;color:var(--green);font-size:20px}.moduleRow button:disabled{opacity:.3}.exception{display:flex;align-items:center;gap:10px;padding:12px 0}.exception input{width:22px;height:22px;accent-color:var(--green)}</style></head><body><header><div class="bar"><a class="brand" href="#home"><span class="logo">F</span><span>FantaPapa<span class="season">STAGIONE 2026/27</span></span></a><button class="menuBtn" id="toggle" aria-expanded="false" aria-controls="drawer">☰ Menu</button></div><nav class="drawer" id="drawer" hidden aria-label="Menu completo"><div class="drawer-inner" id="groups"></div></nav></header><main class="shell" id="main"></main><nav class="bottom" aria-label="Navigazione rapida"><a href="#home"><span>⌂</span>Home</a><a href="#calendario"><span>▦</span>Calendario</a><a href="#classifica"><span>≡</span>Classifica</a><a href="#formazione"><span>⚽</span>Formazione</a><button id="more"><span>☰</span>Altro</button></nav><script>
const groups=[["Campionato",[["home","Home","⌂"],["calendario","Calendario","▦"],["classifica","Classifica","≡"],["formazione","La mia formazione","⚽"],["playoff","Playoff","◇"]]],["Analisi",[["rose","Rose","♙"],["statistiche","Statistiche","▥"],["what-if","What If","↔"],["archivio","Archivio giornate","▤"]]],["La nostra storia",[["albo","Albo d’oro","★"],["precedenti","Precedenti e record","↻"],["montepremi","Montepremi","€"]]],["Gestione",[["regole","Regole di lega","§"],["accessi","Accessi","⌁"],["amministrazione","Amministrazione","⚙"]]]];

const days=[
"Marco-Tomaso,Fabrizio-Alfonso,Paolo-Michele,Daniele-Cepe",
"Cepe-Marco,Michele-Daniele,Alfonso-Paolo,Tomaso-Fabrizio",
"Marco-Alfonso,Tomaso-Michele,Fabrizio-Cepe,Paolo-Daniele",
"Daniele-Marco,Cepe-Paolo,Michele-Fabrizio,Alfonso-Tomaso",
"Marco-Michele,Alfonso-Cepe,Tomaso-Daniele,Fabrizio-Paolo",
"Paolo-Marco,Daniele-Fabrizio,Cepe-Tomaso,Michele-Alfonso",
"Marco-Fabrizio,Tomaso-Paolo,Alfonso-Daniele,Cepe-Michele",
"Marco-Cepe,Daniele-Michele,Paolo-Alfonso,Fabrizio-Tomaso",
"Tomaso-Marco,Alfonso-Fabrizio,Michele-Paolo,Cepe-Daniele",
"Fabrizio-Marco,Paolo-Tomaso,Daniele-Alfonso,Michele-Cepe",
"Marco-Paolo,Fabrizio-Daniele,Tomaso-Cepe,Alfonso-Michele",
"Michele-Marco,Cepe-Alfonso,Daniele-Tomaso,Paolo-Fabrizio",
"Marco-Daniele,Paolo-Cepe,Fabrizio-Michele,Tomaso-Alfonso",
"Alfonso-Marco,Michele-Tomaso,Cepe-Fabrizio,Daniele-Paolo"];
days.push(...days.slice(0,7));
const scores=[[4,3,87,83.5],[5,0,94.5,65],[4,2,89.5,76],[1,3,70,78.5]];
const names=["Alfonso","Cepe","Daniele","Fabrizio","Marco","Michele","Paolo","Tomaso"];
const fmt=n=>n.toLocaleString("it-IT");
const phase=i=>i<7?"Andata":i<14?"Ritorno":"Campo neutro";
const matches=i=>days[i].split(",").map(s=>s.split("-"));
function matchCard(i,j,p){const s=i===0?scores[j]:null;return '<div class="match"><div class="matchline"><strong>'+p[0]+'</strong><b>'+ (s?s[0]+" – "+s[1]:"–")+'</b><strong>'+p[1]+'</strong></div>'+(s?'<div class="matchpoints">'+fmt(s[2])+' · '+fmt(s[3])+' fantapunti <small>· Bozza</small></div>':'')+'</div>'}
function calendar(){main.innerHTML='<h1 class="page-title">Calendario</h1><p class="subtle">21 giornate · 84 incontri · 3 gironi</p><div class="filters"><label>Giornata<select id="day"><option value="all">Tutte le giornate</option>'+days.map((_,i)=>'<option value="'+i+'">'+(i+1)+'ª giornata</option>').join('')+'</select></label><label>Fantallenatore<select id="manager"><option value="all">Tutti</option>'+names.map(n=>'<option>'+n+'</option>').join('')+'</select></label></div><div id="fixtures"></div>';const draw=()=>{let d=document.getElementById("day").value,m=document.getElementById("manager").value;document.getElementById("fixtures").innerHTML=days.map((_,i)=>{if(d!=="all"&&+d!==i)return "";return '<section class="round"><div class="sectionhead"><h2>'+(i+1)+'ª giornata</h2><small>'+phase(i)+' · Serie A '+(i+12)+'ª</small></div>'+matches(i).map((p,j)=>m==="all"||p.includes(m)?matchCard(i,j,p):"").join("")+'</section>'}).join("")};document.getElementById("day").onchange=draw;document.getElementById("manager").onchange=draw;draw()}
function standings(){const rows=names.map(n=>({n,p:0,g:0,v:0,x:0,l:0,gf:0,ga:0,ff:0,fa:0}));matches(0).forEach((p,j)=>{const s=scores[j];p.forEach((n,k)=>{const r=rows.find(x=>x.n===n);r.g++;r.gf=s[k];r.ga=s[1-k];r.ff=s[k+2];r.fa=s[3-k];r.v=+(r.gf>r.ga);r.x=+(r.gf===r.ga);r.l=+(r.gf<r.ga);r.p=3*r.v+r.x})});rows.sort((a,b)=>b.p-a.p||b.gf-a.gf||b.ff-a.ff||(b.gf-b.ga)-(a.gf-a.ga)||(b.ff-b.fa)-(a.ff-a.fa)||a.n.localeCompare(b.n));main.innerHTML='<h1 class="page-title">Classifica</h1><div class="notice"><strong>Classifica provvisoria</strong><br>Prima giornata in bozza, non ancora validata.</div><div class="tablewrap"><table><thead><tr>'+["Pos.","Fantallenatore","Pt","G","V","N","P","GF","GS","DF","FP fatti","FP subiti","Diff. FP"].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+[i+1,r.n,r.p,r.g,r.v,r.x,r.l,r.gf,r.ga,r.gf-r.ga,fmt(r.ff),fmt(r.fa),fmt(r.ff-r.fa)].map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="subtle">A pari punti: scontri diretti se disponibili; altrimenti fantagol fatti, fantapunti fatti, differenze. Media inglese da integrare dopo definizione completa.</p>'}


function rosterView(stats){main.innerHTML='<h1 class="page-title">'+(stats?'Statistiche':'Rose')+'</h1><p class="subtle">Stagione 2026/27 · Dati ASTA verificati</p><div class="filters"><label>Fantallenatore<select id="rosterManager">'+names.map(n=>'<option>'+n+'</option>').join('')+'</select></label><label>Reparto<select id="rosterRole"><option value="all">Tutti</option><option>P</option><option>D</option><option>C</option><option>A</option></select></label>'+(stats?'<label>Periodo<select id="statPeriod"><option>Pre-campionato · 1–11</option><option>Fantacampionato</option><option>Totale stagione</option></select></label><label>Vista<select id="statView"><option>Calciatore</option><option>Fantallenatore</option><option>Reparto</option><option>Reparto per fantallenatore</option></select></label>':'')+'</div><div id="rosterBody"></div>';function draw(){const n=document.getElementById("rosterManager").value;const role=document.getElementById("rosterRole").value;const roles=[["P","Portieri",3],["D","Difensori",8],["C","Centrocampisti",8],["A","Attaccanti",6]];document.getElementById("rosterBody").innerHTML='<div class="notice"><strong>'+n+'</strong><br>25 calciatori · 500 crediti · Rosa verificata</div>'+(stats?'<div class="notice" style="margin-top:12px">Statistiche individuali non ancora pubblicate. Accesso protetto da attivare. Periodo fantacampionato e totale da alimentare con i voti.</div>':'<div class="cards" style="margin-top:12px">'+roles.filter(x=>role==="all"||role===x[0]).map(x=>'<div class="tile"><span>'+x[2]+'</span>'+x[1]+'</div>').join('')+'</div><p class="subtle">Elenco nominale disponibile dopo attivazione degli accessi protetti.</p>')}document.querySelectorAll(".filters select").forEach(x=>x.onchange=draw);draw()}


async function accessView(){main.innerHTML='<h1 class="page-title">Accessi</h1><div class="notice" id="accessPanel">Verifica accesso…</div>';const panel=document.getElementById("accessPanel");try{const r=await fetch("/api/auth/me",{cache:"no-store"});if(!r.ok)throw Error();const state=await r.json();if(!panel.isConnected)return;if(state.user){panel.innerHTML='<strong>Accesso effettuato</strong><p id="identity"></p><button class="primary" id="logout">Esci</button>';panel.querySelector("#identity").textContent=state.user.username+" · "+(state.user.role==="admin"?"Amministratore":"Fantallenatore");panel.querySelector("#logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});accessView()};return}panel.innerHTML='<h2>'+(state.setup?"Attiva amministratore":"Entra in FantaPapa")+'</h2><form id="accessForm" class="accessform"><label>Nome utente<input name="username" autocomplete="username" required '+(state.setup?'value="marco" readonly':'')+'></label>'+(state.setup?'<label>Codice di attivazione<input name="code" type="password" autocomplete="off" required></label>':'')+'<label>Password<input type="password" name="password" autocomplete="'+(state.setup?"new-password":"current-password")+'" minlength="12" maxlength="128" required></label><button class="primary" type="submit">'+(state.setup?"Attiva":"Accedi")+'</button><p role="status" id="loginStatus"></p></form>';panel.querySelector("form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=Object.fromEntries(new FormData(form)),status=panel.querySelector("#loginStatus"),btn=form.querySelector("button");btn.disabled=true;status.textContent="Verifica…";try{const res=await fetch("/api/auth/"+(state.setup?"setup":"login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const data=await res.json();if(!res.ok)throw Error(data.error||"Accesso non riuscito");accessView()}catch(e){status.textContent=e.message;btn.disabled=false}}}catch{panel.textContent="Accessi non disponibili. Verifica pubblicazione in corso."}}


function formationView(){const modules=["3-4-3","4-3-3","4-4-2","3-5-2","5-3-2","4-5-1","5-4-1"];main.innerHTML='<h1 class="page-title">Formazione</h1><div class="notice"><strong>Anteprima configurazione</strong><br>Le rose nominali e i salvataggi saranno attivati dopo il collaudo degli accessi. Le preferenze qui non vengono inviate.</div><div class="filters"><label>Giornata<select id="formDay">'+days.map((_,i)=>'<option value="'+i+'" '+(i===1?'selected':'')+'>'+(i+1)+'ª giornata · Serie A '+(i+12)+'</option>').join('')+'</select></label></div><div id="formDeadline" class="subtle"></div><div class="sectionhead"><h2>Priorità dei moduli</h2></div><div id="moduleList"></div><div class="sectionhead"><h2>Ordine dei calciatori</h2></div><div class="cards">'+[["Portieri",3],["Difensori",8],["Centrocampisti",8],["Attaccanti",6]].map(x=>'<div class="tile"><span>'+x[1]+'</span>'+x[0]+'<small>In attesa della rosa</small></div>').join('')+'</div><div class="sectionhead"><h2>Eccezioni tattiche</h2></div><div class="notice"><p>Possibilità di rinunciare alla riserva di reparto, secondo le condizioni che verranno definite nel motore.</p>'+["Difesa","Centrocampo","Attacco"].map(n=>'<label class="exception"><input type="checkbox"> '+n+' — valuta modulo senza riserva</label>').join('')+'<p class="subtle">Nessuna eccezione senza cambio per i portieri.</p></div><button class="primary" disabled style="opacity:.5;margin-top:20px">Salva formazione</button>';const draw=()=>{document.getElementById("moduleList").innerHTML=modules.map((m,i)=>'<div class="moduleRow"><span>'+ (i+1) +'</span><strong>'+m+'</strong><button data-i="'+i+'" data-d="-1" aria-label="Alza priorità" '+(i===0?'disabled':'')+'>↑</button><button data-i="'+i+'" data-d="1" aria-label="Abbassa priorità" '+(i===modules.length-1?'disabled':'')+'>↓</button></div>').join('');document.querySelectorAll(".moduleRow button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=i+(+b.dataset.d);[modules[i],modules[j]]=[modules[j],modules[i]];draw()})};const deadline=()=>document.getElementById("formDeadline").textContent="Scadenza: da verificare sul calendario ufficiale di Serie A.";document.getElementById("formDay").onchange=deadline;deadline();draw()}
function playoffView(){main.innerHTML='<h1 class="page-title">Playoff</h1><p class="subtle">Quarti di finale · Gara unica</p>'+[[1,8],[2,7],[3,6],[4,5]].map(p=>'<div class="match"><div class="matchline"><strong>'+p[0]+'ª classificata</strong><b>–</b><strong>'+p[1]+'ª classificata</strong></div></div>').join('')+'<div class="notice" style="margin-top:20px"><strong>Vantaggio di classifica</strong><p>Alla meglio classificata viene aggiunta la differenza dei punti in regular season ai fantapunti della partita. In caso di parità passa la meglio classificata.</p><p>Accoppiamenti effettivi dopo la regular season.</p></div>'}

const all=groups.flatMap(g=>g[1]),drawer=document.getElementById("drawer"),toggle=document.getElementById("toggle"),main=document.getElementById("main");document.getElementById("groups").innerHTML=groups.map(g=>'<div><h3>'+g[0]+'</h3>'+g[1].map(x=>'<a href="#'+x[0]+'">'+x[1]+'</a>').join('')+'</div>').join('');function menu(open){drawer.hidden=!open;toggle.setAttribute("aria-expanded",String(open));if(open)window.scrollTo(0,0)}toggle.onclick=()=>menu(drawer.hidden);document.getElementById("more").onclick=()=>menu(drawer.hidden);const tile=x=>'<a class="tile" href="#'+x[0]+'"><span aria-hidden="true">'+x[2]+'</span>'+x[1]+'</a>';function render(){const id=location.hash.slice(1)||"home",item=all.find(x=>x[0]===id)||all[0];menu(false);document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+item[0]?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(item[0]==='home'){main.innerHTML='<div class="hero"><div class="eyebrow">FantaPapa · 2026/27</div><h1>Il nostro<br>campionato.</h1><p>8 fantallenatori · 21 giornate · Playoff</p><a class="primary" href="#formazione">La mia formazione →</a></div><div class="sectionhead"><h2>Campionato</h2><a href="#calendario">Calendario →</a></div><div class="notice"><strong>2ª giornata FantaPapa</strong><br>13ª giornata di Serie A · Scadenza da confermare.</div><div class="sectionhead"><h2>Accesso rapido</h2></div><div class="cards">'+["calendario","classifica","rose","statistiche","playoff","what-if","albo","precedenti"].map(k=>tile(all.find(x=>x[0]===k))).join('')+'</div>'}else if(item[0]==="calendario"){calendar()}else if(item[0]==="classifica"){standings()}else if(item[0]==="formazione"){formationView()}else if(item[0]==="playoff"){playoffView()}else if(item[0]==="accessi"){accessView()}else if(item[0]==="rose"){rosterView(false)}else if(item[0]==="statistiche"){rosterView(true)}else{main.innerHTML='<p class="subtle">FantaPapa 2026/27</p><h1 class="page-title">'+item[1]+'</h1><div class="notice"><strong>Sezione in preparazione</strong><p>Questa pagina sarà attivata dopo il caricamento e la verifica dei dati. Nessun dato simulato.</p><a href="#home">Torna alla Home</a></div>'}main.innerHTML+='<footer>FantaPapa · Versione campionato 02</footer>';window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
