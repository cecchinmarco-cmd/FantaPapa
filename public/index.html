)+' · Blocco: '+date(k.kickoff+60000)+'</p>':'<p class="roundDeadline pendingSchedule">Orario di apertura da acquisire</p>';const games=kind==="serie"?(serieAFixtures[i]||[]).map(p=>'<div class="match"><div class="matchline"><strong>'+p[0]+'</strong><b>–</b><strong>'+p[1]+'</strong></div></div>').join(""):matches(i).map((p,j)=>{if(m!=="all"&&!p.includes(m))return "";let card=matchCard(i,j,p);p.forEach(n=>{const st=statuses.find(s=>s.day===i+1&&s.owner===n.toLowerCase());if(st){const cls=st.actor==="ufficio"?"inherited":st.late?"extraordinary":"confirmed";card=card.replace("<strong>"+n+"</strong>",'<strong class="delivery '+cls+'" title="'+(cls==="inherited"?"Recuperata d’ufficio":cls==="extraordinary"?"Intervento straordinario":"Confermata")+'">'+n+'</strong>')}});return card}).join("");return '<section class="round"><div class="sectionhead"><h2>'+(i+1)+'ª FantaPapa</h2><small>'+phase(i)+' · Serie A '+(i+12)+'ª</small></div>'+deadline+games+'</section>'}).join("")+((kind==="fanta")?[["Quarti di finale",["1ª – 8ª","2ª – 7ª","3ª – 6ª","4ª – 5ª"]],["Semifinali",["Vincente Q1 – Vincente Q4","Vincente Q2 – Vincente Q3"]],["Finale e 3°/4° posto",["Vincenti semifinali · 1°/2°","Sconfitti semifinali · 3°/4°"]]].map(([title,fixtures],i)=>d==="all"||+d===21+i?'<section class="round"><div class="sectionhead"><h2>'+title+'</h2><small>'+ (22+i)+'ª FantaPapa · Serie A '+(33+i)+'ª</small></div><p class="roundDeadline pendingSchedule">Orario e partecipanti da definire</p>'+fixtures.map(x=>'<div class="match"><strong>'+x+'</strong></div>').join("")+'</section>':"").join(""):"")};const choice=document.getElementById("printMatchChoice"),printStatus=document.getElementById("calendarPrintStatus");function updatePrintChoices(){const i=document.getElementById("day").value;const valid=i!=="all"&&+i<21&&document.getElementById("calendarKind").value==="fanta";document.getElementById("printRound").disabled=!valid;document.getElementById("printMatch").disabled=!valid;document.getElementById("p function standings(){const rows=names.map(n=>({n,p:0,g:0,v:0,x:0,l:0,gf:0,ga:0,ff:0,fa:0}));matches(0).forEach((p,j)=>{const s=scores[j];p.forEach((n,k)=>{const r=rows.find(x=>x.n===n);r.g++;r.gf=s[k];r.ga=s[1-k];r.ff=s[k+2];r.fa=s[3-k];r.v=+(r.gf>r.ga);r.x=+(r.gf===r.ga);r.l=+(r.gf<r.ga);r.p=3*r.v+r.x})});rows.sort((a,b)=>b.p-a.p||b.gf-a.gf||b.ff-a.ff||(b.gf-b.ga)-(a.gf-a.ga)||(b.ff-b.fa)-(a.ff-a.fa)||a.n.localeCompare(b.n));main.innerHTML='<h1 class="page-title">Classifica</h1><div class="notice"><strong>Classifica provvisoria</strong><br>Prima giornata in bozza, non ancora validata.</div><div class="tablewrap"><table><thead><tr>'+["Pos.","Fantallenatore","Pt","G","V","N","P","GF","GS","DF","FP fatti","FP subiti","Diff. FP"].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+[i+1,r.n,r.p,r.g,r.v,r.x,r.l,r.gf,r.ga,r.gf-r.ga,fmt(r.ff),fmt(r.fa),fmt(r.ff-r.fa)].map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="subtle">A pari punti: scontri diretti se disponibili; altrimenti fantagol fatti, fantapunti fatti, differenze. Media inglese da integrare dopo definizione completa.</p>'}

what-if")}else if(item[0]==="regole"){rulesView()}else if(item[0]==="amministrazione"){adminView()}else if(item[0]==="accessi"){accessView()}else if(item[0]==="rose"){rosterView(false)}else if(item[0]==="statistiche"){rosterView(true)}else{main.innerHTML='<p class="subtle">FantaPapa 2026/27</p><h1 class="page-title">'+item[1]+'</h1><div class="notice"><strong>Sezione in preparazione</strong><p>Questa pagina sarà attivata dopo il caricamento e la verifica dei dati. Nessun dato simulato.</p><a href="#home">Torna alla Home</a></div>'}main.insertAdjacentHTML('beforeend','<footer>FantaPapa · Versione formazione 46</footer>');window.scrollTo(0,0)}window.addEventListener('hashchange',()=>{sessionReady=false;render()});render();
</script></body></html>
