<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FantaPapa · Collaudo</title><style>body{font:17px system-ui;background:#f3f6f4;color:#17372b;margin:0}main{max-width:580px;margin:auto;padding:28px}section{background:white;padding:22px;border-radius:16px;margin:16px 0}button,a{display:block;padding:14px;background:#176443;color:white;border:0;border-radius:10px;font:inherit;text-decoration:none;text-align:center;margin:12px 0}button{width:100%}pre{white-space:pre-wrap}</style><main><h1>FantaPapa</h1><p>Collaudo tecnico · Versione 3</p><section><h2>Verifica automatica</h2><button id="run">Avvia tutti i test</button><pre id="result" aria-live="polite">Pronto.</pre><a href="/api/test.pdf">Apri PDF di prova</a></section><p>Solo dati di prova, nessun account reale.</p></main><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');out.textContent='Verifica in corso…';try{const db=await fetch('/api/test',{cache:'no-store'}).then(r=>r.json());const pdf=await fetch('/api/test.pdf').then(r=>r.arrayBuffer());const b64=btoa(String.fromCharCode(...new Uint8Array(pdf)));const r=await fetch('/api/collaudo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdf:b64})});const v=await r.json();out.textContent='Database: '+(db.database?'OK':'ERRORE')+'\nPDF: '+(b64.startsWith('JVBER')?'OK':'ERRORE')+'\nCaricamento e rilettura PDF: '+(v.upload?'OK':'ERRORE')+'\nVerifica password: '+(v.authentication?'OK':'ERRORE');}catch(e){out.textContent='Errore durante la verifica.';}};</script></html>
