lcolo con il regolamento FantaPapa. Fattore campo escluso.</p><p class="subtle">Potenziale titolari: precedenza ai titolari reali, poi subentrati. Potenziale assoluto: migliori fantavoti indipendentemente dalla titolarità. Efficienza = effettivi / potenziale. Il valore titolari può essere superato.</p>'+(list.some(t=>t.n)?'<div class="tablewrap wiTable"><table><thead><tr><th>Pos.</th><th>Fantallenatore</th><th>G</th><th>FP<br>effettivi'+suffix+'</th><th>FP potenziali<br>titolari'+suffix+'</th><th>FP potenziali<br>assoluti'+suffix+'</th><th>Diff.<br>titolari</th><th>Diff.<br>assoluto</th><th>Eff. %<br>titolari</th><th>Eff. %<br>assoluto</th></tr></thead><tbody>'+list.map((t,i)=>'<tr><td>'+(t.n?i+1:"—")+'</td><td>'+escapeHtml(name(t.owner))+'</td><td>'+t.n+'</td>'+[t.real,t.tit,t.abs,t.tit-t.real,t.abs-t.real,t.effT,t.effA].map(v=>'<td>'+num(t.n?v:null)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+list.filter(t=>t.n).map(t=>'<details class="rule"><summary>'+escapeHtml(name(t.owner))+' · Dettaglio giornate e formazioni</summary>'+t.details.map(d=>'<h3>'+d.day+'ª giornata</h3><p>Effettivi '+num(d.row.real)+' · Potenziale titolari '+num(d.row.realistic.points)+' · Potenziale assoluto '+num(d.row.absolute.points)+'</p>'+[["Potenziale titolari",d.row.realistic],["Potenziale assoluto",d.row.absolute]].map(([label,opt])=>'<details class="rule"><summary>'+label+' · '+opt.module+' · '+opt.count+'/11</summary><div class="tablewrap"><table><thead><tr><th>R</th><th>Calciatore</th><th>Stato</th><th>FV</th></tr></thead><tbody>'+opt.xi.map(p=>'<tr><td>'+p.role+'</td><td>'+escapeHtml(p.name)+'</td><td>'+p.status+'</td><td>'+num(p.fv)+'</td></tr>').join("")+'</tbody></table></div></details>').join("")).join("")+'</details>').join(""):'<div class="notice">Nessuna giornata confrontabile: servono voti completi e risultati ufficiali.</div>');const wrap=root.querySelector('.wiTable');if(wrap)wrap.scrollLeft=scroll}try{const r=await fetch("/api/auth/what-if",{cache:"no-store async function archiveView(whatif){if(whatif)return whatIfView();main.innerHTML='<h1 class="page-title">'+(whatif?'What If':'Archivio giornate')+'</h1><p class="subtle">'+(whatif?'Confronto tra risultati effettivi e scenari alternativi':'Risultati definitivi, formazioni e documenti')+'</p><div class="filters"><label>Giornata<select id="archiveDay">'+days.map((_,i)=>'<option value="'+i+'">'+(i+1)+'ª giornata · Serie A '+(i+12)+'</option>').join('')+'</select></label></div><div id="archiveStatus" class="notice" role="status"></div>';const draw=()=>{const i=+document.getElementById("archiveDay").value;if(!whatif&&i===0&&roundConfirmed(1)){document.getElementById("archiveStatus").innerHTML='<strong>Giornata ufficiale</strong>'+matches(0).map((p,j)=>matchCard(0,j,p)).join('');return}document.getElementById("archiveStatus").textContent=i===0?'Prima giornata da confermare. '+(whatif?'Il confronto sarà disponibile dopo la validazione dei voti.':'L’archiviazione richiede la convalida dei quattro risultati.'):'Giornata non ancora archiviata. '+(whatif?'Occorrono voti definitivi e motore di calcolo.':'Nessun documento definitivo disponibile.')};document.getElementById("archiveDay").onchange=draw;const anchor=document.getElementById("archiveStatus");try{await loadResults();if(anchor.isConnected)draw()}catch(e){if(anchor.isConnected)anchor.textContent=e.message}}
function rulesView(){const sections=[["1. Campionato e rose","<p>Otto fantallenatori, 500 crediti iniziali e 25 calciatori per rosa: 3 portieri, 8 difensori, 8 centrocampisti e 6 attaccanti.</p><p>21 giornate di regular season: 7 di andata, 7 di ritorno, 7 in campo neutro. Fattore campo +2 nelle prime 14 giornate. Vittoria 3 punti, pareggio 1, sconfitta 0.</p>"],["2. Guida pratica: consegna la formazione","<ol><li>Accedi con il tuo account e apri La mia formazione: la tua rosa è già presente.</li><li>Seleziona la giornata. Ordina tutti i 25 calciatori per priorità all’interno del rispettivo reparto, trascinando le maniglie.</li><li>Ordina i moduli per preferenza: 3-4-3, 4-3-3, 4-4-2, 3-5-2, 5-3-2, 4-5-1, 5-4-1. Escludi quelli che non vuoi utilizzare.</li><li>Imposta, se desideri, le eccezioni individuali e di reparto descritte sotto.</li><li>Premi <strong>Conferma le priorità</strong>. Controlla data e ora di conferma. Puoi stampare il PDF della configurazione confermata.</li></ol><p><strong>Non devi schierare manualmente undici calciatori:</strong> indichi le priorità di tutta la rosa, i moduli e le eccezioni.</p>"],["3. Scadenza e formazione d’ufficio","<p>La consegna chiude un minuto dopo l’inizio della prima partita reale della giornata, secondo l’orario ufficiale registrato nel calendario. Puoi confermare nuovamente prima della scadenza; vale l’ultima conferma.</p><p>Prima della scadenza, una formazione non consegnata non compare come confermata nel calendario. Alla chiusura, se manca la consegna, si applica d’ufficio l’ultima configurazione confermata di una giornata precedente, comprese priorità, moduli ed eccezioni. Se non esiste una precedente conferma, non viene inventata una formazione.</p><p>Le consegne straordinarie sono riservate all’amministratore o ai collaboratori autorizzati con deroga, per la propria rosa. Le operazioni sono registrate.</p>"],["4. Come si determinano modulo e undici","<p>Si parte dalle priorità dei giocatori e dei moduli definite dal fantallenatore. Si considerano in prima battuta i titolari reali di Serie A, poi i subentrati che ricevono voto.</p><p>Si cerca normalmente un modulo che permetta undici giocatori e almeno una riserva utile per ciascun reparto di movimento: difesa, centrocampo e attacco. Quando la copertura completa non è possibile, la precedenza dei reparti è attacco, centrocampo, difesa, rispettando le priorità indicate. Le eccezioni esplicite possono modificare questo criterio.</p><p>Le assenze di voto si gestiscono con le riserve utili secondo priorità e vincoli. Se non è possibile completare gli undici, si gioca in inferiorità numerica. Non si scelgono semplicemente gli undici fantavoti migliori.</p>"],["5. Eccezioni tattiche","<h3>A — Reparto senza cambio</h3><p>Accetti di mantenere il modulo anche senza riserva nel reparto, alle condizioni selezionate: attacco 1, 2 o 3; centrocampo e difesa 3, 4 o 5. L’opzione non si applica ai portieri.</p><p>Esempio: selezioni attacco 3 perché vuoi mantenere tre punte partite titolari anche se manca un cambio.</p><h3>B — Primo cambio</h3><p>Indichi un calciatore come primo cambio del reparto se parte dalla panchina reale e prende voto; se parte titolare segue la priorità ordinaria. Un solo primo cambio per reparto.</p><h3>C — Obbligatorio negli undici</h3><p>Indichi un calciatore da includere negli undici anche se parte dalla panchina reale, purché riceva voto. Se non riceve voto, il posto è sostituibile secondo le regole di copertura.</p><p>Le eccezioni intervengono nella costruzione dell’undici, prima del calcolo dei cambi migliorativi.</p><p><span style=\"background:#fff0a1;padding:3px\">Giallo: obbligatorio negli undici</span> · <span style=\"background:#ffd09b;padding:3px\">Arancione: primo cambio</span> nei PDF.</p>"],["6. Sostituzioni migliorative","<p>Soltanto dopo aver definito modulo e undici si valutano fino a due cambi migliorativi, al massimo uno per reparto, portiere compreso. Si rispettano i vincoli e il primo cambio eleggibile di ciascun reparto, scegliendo fino a due sostituzioni che producono il maggiore incremento complessivo.</p><p>Esempio: miglioramenti possibili di +2 in difesa, +1,5 a centrocampo, +0,5 in attacco: si scelgono difesa e centrocampo. Un cambio necessario per coprire un senza voto non è un cambio migliorativo.</p>"],["7. Bonus, malus e fattore campo","<div class=\"tablewrap\"><table><thead><tr><th>Evento</th><th>Punti</th></tr></thead><tbody><tr><td>Gol</td><td>+3</td></tr><tr><td>Assist</td><td>+1</td></tr><tr><td>Ammonizione</td><td>−0,5</td></tr><tr><td>Espulsione</td><td>−1</td></tr><tr><td>Rigore sbagliato</td><td>−3</td></tr><tr><td>Autorete</td><td>−1</td></tr><tr><td>Gol subito dal portiere</td><td>−1</td></tr><tr><td>Rigore non subito dal portiere (parato o fuori)</td><td>+3</td></tr><tr><td>Fattore campo, prime 14 giornate</td><td>+2</td></tr></tbody></table></div><p>Nessun bonus automatico per porta inviolata. Il +3 al portiere si applica anche se il rigore termina fuori.</p>"],["8. Fasce fantagol","<div class=\"tablewrap\"><table><thead><tr><th>Fantapunti</th><th>Gol</th></tr></thead><tbody><tr><td>Fino a 65,5</td><td>0</td></tr><tr><td>66–71,5</td><td>1</td></tr><tr><td>72–77,5</td><td>2</td></tr><tr><td>78–83,5</td><td>3</td></tr><tr><td>84–89,5</td><td>4</td></tr><tr><td>90–95,5</td><td>5</td></tr><tr><td>96–101,5</td><td>6</td></tr><tr><td>102–107,5</td><td>7</td></tr></tbody></table></div><p>Ogni 6 fantapunti successivi: un gol in più.</p>"],["9. Classifica e convalida","<p>Contano soltanto gli incontri convalidati dall’amministratore. A pari punti si applicano, esclusivamente agli scontri diretti tra le squadre a pari merito: punti, fantagol fatti, fantapunti fatti, differenza fantagol, differenza fantapunti, media inglese.</p><p>In assenza di scontri diretti: fantagol fatti, fantapunti fatti, differenza fantagol, differenza fantapunti, media inglese complessivi.</p>"],["10. Playoff e premi","<p>Quarti: 1ª–8ª, 2ª–7ª, 3ª–6ª, 4ª–5ª. Gara unica con vantaggio per la meglio classificata pari alla differenza dei punti in classifica; confronto sui fantapunti. A parità prevale la meglio classificata. Seguono semifinali e finali per primo e terzo posto.</p><p>Quota individuale 25 euro. Montepremi previsto 200 euro: primo 125, secondo 50, terzo 25.</p>"],["11. Accesso e consultazione","<p>Registrazione mediante invito personale monouso, valido 48 ore. Poi accesso con nome utente e password. Se dimentichi la password chiedi un nuovo link all’amministratore. Non condividere il link personale.</p><p>I menu disponibili dipendono dai permessi assegnati. Gli ospiti non hanno una rosa. Le formazioni confermate e i risultati sono consultabili secondo autorizzazione.</p><p><strong>Stato del sito:</strong> la consegna delle priorità e la convalida dei risultati sono implementate; il motore automatico di calcolo e i relativi tabellini sono ancora da completare e collaudare. Il regolamento descrive le regole da applicare, non certifica che tutte siano già automatizzate.</p>"]];main.innerHTML='<h1 class="page-title">Regolamento FantaPapa 26/27</h1><p class="subtle">Regole di lega e guida pratica · revisione amministratore</p>'+sections.map((x,i)=>'<details class="rule" '+(i===1?'open':'')+'><summary>'+x[0]+'</summary><div class="ruleBody">'+x[1]+'</div></details>').join('')}

async function openAdminRoom(panel,room){panel.innerHTML='<button class="roomBack">← Menu amministrativo</button><div class="roomContent"></div>';panel.querySelector(".roomBack").onclick=()=>showAdminRooms(panel);const el=panel.querySelector(".roomContent");try{if(room==="accounts")await permissionPanel(el);else if(room==="invites"){const res=await fetch("/api/auth/permissions",{cache:"no-store"});if(!res.ok)throw Error("Inviti non disponibili");const data=await res.json();if(el.isConnected)invitePanel(el,data)}else if(room==="files"){statsImport(el);rosterImport(el)}else if(room==="formations")await deadlinePanel(el);else if(room==="results")await resultsPanel(el);else if(room==="personal")await photoPanel(el);else if(room==="logins")await loginLogPanel(el)}catch(e){el.textContent=e.message}window.scrollTo(0,0)}

async function compressPhoto(file){if(!file||file.size>25000000)throw Error("Scegli una foto di massimo 25 MB");const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const c=document.createElement("canvas");const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);for(const quality of [.86,.72,.58,.42,.28]){const data=c.toDataURL("image/jpeg",quality);if(data.length<=470000)return data}throw Error("Foto troppo grande dopo la compressione")}finally{URL.revokeObjectURL(url)}}

function invitePanel(panel,data){const el=document.createElement("section");el.className="notice";el.innerHTML='<h2>Inviti personali · WhatsApp</h2><p>Invia il link solo nella chat privata del destinatario. Scade dopo 48 ore, è monouso e un nuovo invito revoca il precedente. Per recuperare la password genera un nuovo link.</p><div id="inviteRows"></div><details class="rule"><summary>Invita un nuovo ospite L0</summary><form class="accessform"><label>Nome utente<input name="username" required pattern="[a-z0-9_-]{2,30}" maxlength="30"></label><button class="primary">Genera invito ospite</button></form></details><p role="status"></p><div class="inviteOutput" hidden></div>';panel.prepend(el);const rows=el.querySelector("#inviteRows"),status=el.querySelector('[role="status"]'),output=el.querySelector(".inviteOutput");

function statsImport(panel){const el=document.createElement("section");el.className="notice";el.innerHTML='<h2>Aggiorna voti e fantamedie</h2><p>Importazione iniziale G1–12 · FM, FM5 e presenze reali.</p><input type="file" accept=".json,application/json"><button class="primary" type="button">Importa statistiche G1–12</button><p role="status"></p>';panel.prepend(el);el.querySelector("button").onclick=async()=>{const file=el.querySelector("input").files[0],status=el.querySelector('[role="status"]'),btn=el.querySelector("button");if(!file){status.textContent="Seleziona il file delle statistiche.";return}btn.disabled=true;try{const res=await fetch("/api/auth/stats/import",{method:"POST",headers:{"Content-Type":"application/json"},body:await file.text()});const data=await res.json();if(!res.ok)throw Error(data.error||"Importazione non riuscita");status.textContent="Statistiche importate: "+data.count+" giocatori, fino alla giornata "+data.through;el.insertAdjacentHTML("beforeend",'<p><a href="#formazione">Apri formazione aggiornata</a></p>')}catch(e){status.textContent=e.message}finally{btn.disabled=false}}}


async function resultsPanel(panel){const el=document.createElement("section");el.className="notice";el.innerHTML='<h2>Convalida risultati</h2><p>1ª FantaPapa · 12ª Serie A</p><div class="resultList"></div><p role="status"></p>';panel.prepend(el);const list=el.querySelector(".resultList"),status=el.querySelector('[role="status"]');function draw(){const rs=resultRows.filter(r=>r.day===1);list.innerHTML='<p><strong>'+rs.filter(r=>r.confirmed).length+'/4</strong> incontri convalidati</p>'+rs.map(r=>'<div class="match"><div class="matchline"><strong>'+escapeHtml(r.home)+'</strong><b>'+r.hg+' – '+r.ag+'</b><strong>'+escapeHtml(r.away)+'</strong></div><p class="matchpoints">'+fmt(r.hf)+' · '+fmt(r.af)+' FP</p><div class="resultActions"><small>'+(r.confirmed?'Convalidato':'Da confermare')+'</small><button class="primary" data-match="'+r.match_no+'" data-confirm="'+Number(!r.confirmed)+'">'+(r.confirmed?'Riapri':'Conferma')+'</button></div></div>').join("")+'<button class="primary" data-match="all" data-confirm="1" '+(roundConfirmed(1)?'disabled':'')+'>Conferma tutta la giornata</button>';list.querySelectorAll("button").forEach(b=>b.onclick=async()=>{if(b.dataset.confirm==="0"&&!window.confirm("Riaprire questo risultato? Verrà escluso dalla classifica ufficiale."))return;list.querySelectorAll("button").forEach(x=>x.disabled=true);status.textContent="Salvataggio…";try{const res=await fetch("/api/auth/results",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({day:1,match:b.dataset.match==="all"?null:+b.dataset.match,confirmed:b.dataset.confirm==="1"})});const v=await res.json();if(!res.ok)throw Error(v.error);acceptResults(v.rows);draw();status.textContent=roundConfirmed(1)?"Giornata ufficializzata.":"Salvataggio riuscito."}catch(e){draw();status.textContent=e.message}})}try{await loadResults();draw()}catch(e){status.textContent=e.message}}

async function deadlinePanel(panel){const el=document.createElement("section");el.className="notice";el.innerHTML='<h2>Scadenze e deroghe</h2><div class="accessform"><label>Giornata<select id="deadlineDay">'+days.map((_,i)=>'<option value="'+(i+1)+'" '+(i===1?'selected':'')+'>'+(i+1)+'ª · Serie A '+(i+12)+'</option>').join("")+'</select></label><label>Prima partita (ora italiana)<input id="kickoffTime" type="datetime-local"></label><button class="primary" id="saveDeadline">Salva orario ufficiale</button><label>Deroga L2 Pro, solo propria formazione<select id="overrideMinutes"><option value="0">Revoca</option><option>5</option><option>10</option><option>15</option><option>30</option><option>60</option></select></label><button class="primary" id="saveOverride">Applica deroga</button><p role="status"></p></div>';panel.prepend(el);const status=el.querySelector('[role="status"]'),day=el.querySelector("#deadlineDay"),time=el.querySelector("#kickoffTime");let rows=[];try{const res=await fetch("/api/auth/formation/deadlines");rows=(await res.json()).rows||[]}catch{}function show(){const row=rows.find(x=>x.day===+day.value);time.value=row?new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(row.kickoff)).replace(" ","T"):""}day.onchange=show;show();async function send(path,body){const res=await fetch("/api/auth/formation/"+path+"?day="+day.value,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error);return data}el.querySelector("#saveDeadline").onclick=async()=>{try{if(!time.value)throw Error("Inserisci orario");const naive=Date.parse(time.value+"Z");const off=new Intl.DateTimeFormat("en",{timeZone:"Europe/Rome",timeZoneName:"longOffset"}).formatToParts(new Date(naive)).find(p=>p.type==="timeZoneName").value;const m=off.match(/GMT([+-])(\\d\\d):(\\d\\d)/);const kickoff=naive-(m?(m[1]==="+"?1:-1)*(+m[2]*60+ +m[3])*60000:0);await send("deadlines",{kickoff});rows=rows.filter(r=>r.day!==+day.value);rows.push({day:+day.value,kickoff});status.textContent="Orario salvato. Blocco un minuto dopo."}catch(e){status.textContent=e.message}};el.querySelector("#saveOverride").onclick=async()=>{try{const v=await send("override",{minutes:+el.querySelector("#overrideMinutes").value});status.textContent=v.until?"Deroga fino alle "+new Date(v.until).toLocaleTimeString("it-IT",{timeZone:"Europe/Rome"}):"Deroga revocata"}catch(e){status.textContent=e.message}}}
const all=groups.flatMap(g=>g[1]),main=document.getElementById("main");let activeUser=null,sessionReady=false,renderSequence=0;

function navIcon(id){return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">'+(homeIcons[id]?.[1]||"")+'</svg>'}
function sectionAllowed(id){if(id==="accessi"||id==="home")return true;if(!activeUser)return false;if(activeUser.level===3)return true;if(id==="amministrazione")return false;return activeUser.views.includes(id)}
function tile(x){const allowed=sectionAllowed(x[0]),inner=navIcon(x[0])+'<span class="tileLabel">'+escapeHtml(x[1])+'</span>';return allowed?'<a class="tile homeTile" style="--tile-color:'+homeIcons[x[0]][0]+'" href="#'+x[0]+'">'+inner+'</a>':'<div class="tile homeTile lockedTile" aria-disabled="true" title="Permesso non disponibile">'+inner+'<small aria-hidden="true">🔒</small></div>'}
const homeMenu=["calendario","formazione","classifica","rose","statistiche","playoff","what-if","archivio","albo","precedenti","montepremi","regole","bacheca","amministrazione"];
function visibleHomeMenu(){return homeMenu.filter(k=>k!=="amministrazione"||activeUser?.level===3)}
function applyNavigation(){const acc=document.getElementById("accountLink"),nav=document.querySelector(".bottom");acc.hidden=!activeUser;nav.hidden=!activeUser;document.body.classList.toggle("signedOut",!activeUser);acc.querySelector("span").textContent=activeUser?activeUser.username:"Accedi";if(!activeUser){cachedGroupPhoto=undefined;nav.replaceChildren();return}const old=nav.scrollLeft,keys=["home",...visibleHomeMenu()],signature=keys.map(k=>k+":"+sectionAllowed(k)).join("|");if(nav.dataset.signature!==signature||!nav.children.length){nav.dataset.signature=signature;nav.innerHTML=keys.map(k=>{const allowed=sectionAllowed(k),name=all.find(x=>x[0]===k)[1];return '<a data-section="'+k+'" '+(allowed?'href="#'+k+'"':'class="lockedNav" aria-disabled="true" tabindex="-1"')+'><span>'+navIcon(k)+(allowed?'':'<small class="navLock">🔒</small>')+'</span>'+escapeHtml(name)+'</a>'}).join("");nav.scrollLeft=old}nav.querySelectorAll("[aria-current]").forEach(a=>a.removeAttribute("aria-current"));const current=nav.querySelector('[data-section="'+(keys.includes(location.hash.slice(1))?location.hash.slice(1):"home")+'"]');if(current){current.setAttribute("aria-current","page");const left=current.offsetLeft-nav.offsetLeft;/* Keep the user-selected horizontal scroll position; no automatic jump. */}}
let lastRenderedSection=null;async function render(){const seq=++renderSequence;if(location.hash.startsWith("#invito=")){activeUser=null;sessionReady=false;applyNavigation();document.getElementById("backHome").hidden=true;return redeemView(location.hash.slice(8))}const id=location.hash.slice(1)||"home",item=all.find(x=>x[0]===id)||all[0];document.getElementById("backHome").hidden=item[0]==="home"||item[0]==="accessi";if(!sessionReady){if(!activeUser)main.innerHTML='<p class="subtle">Verifica accesso…</p>';try{const response=await fetch("/api/auth/me",{cache:"no-store"});if(!response.ok)throw Error();const s=await response.json();if(seq!==renderSequence)return;activeUser=s.user;sessionReady=true}catch{if(seq===renderSequence)main.innerHTML='<p>Impossibile verificare la sessione. <a href="#accessi">Accedi</a></p>';return}}applyNavigation();if(!activeUser&&id!=="accessi"){location.hash="accessi";return}if(!sectionAllowed(item[0])){main.innerHTML='<h1 class="page-title">Accesso non autorizzato</h1><div class="notice">Questa sezione non è abilitata per il tuo livello. <a href="#home">Torna al menu</a></div>';return}document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+item[0]?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(item[0]==='home'){main.innerHTML='<div id="homeGroupPhoto" hidden></div><div class="cards homeCards">'+visibleHomeMenu().map(k=>tile(all.find(x=>x[0]===k))).join("")+'</div>';showGroupPhoto(document.getElementById("homeGroupPhoto"))}else if(item[0]==="bacheca"){main.innerHTML='<h1 class="page-title">Bacheca</h1><div class="notice"><strong>Comunicazioni, appuntamenti e sedi</strong><p>Sezione in preparazione. Gli avvisi ufficiali e la gestione delle comunicazioni saranno attivati in un prossimo aggiornamento.</p></div>'}else if(item[0]==="calendario"){calendar()}else if(item[0]==="classifica"){standings()}else if(item[0]==="formazione"){formationView()}else if(item[0]==="playoff"){playoffView()}else if(item[0]==="albo"||item[0]==="precedenti"){historyView(item[0])}else if(item[0]==="montepremi"){prizeView()}else if(item[0]==="what-if"||item[0]==="archivio"){archiveView(item[0]==="what-if")}else if(item[0]==="regole"){rulesView()}else if(item[0]==="amministrazione"){adminView()}else if(item[0]==="accessi"){accessView()}else if(item[0]==="rose"){rosterView(false)}else if(item[0]==="statistiche"){rosterView(true)}else{main.innerHTML='<p class="subtle">FantaPapa 2026/27</p><h1 class="page-title">'+item[1]+'</h1><div class="notice"><strong>Sezione in preparazione</strong><p>Questa pagina sarà attivata dopo il caricamento e la verifica dei dati. Nessun dato simulato.</p><a href="#home">Torna alla Home</a></div>'}if(!document.getElementById('appVersion'))main.insertAdjacentHTML('afterend','<footer id="appVersion">FantaPapa · Versione formazione 84</footer>');if(lastRenderedSection!==item[0]){lastRenderedSection=item[0];window.scrollTo({top:0,left:0,behavior:'instant'})}}document.getElementById('accountLink').addEventListener('click',e=>{if(location.hash==='#accessi'){e.preventDefault();sessionReady=false;render()}});window.addEventListener('hashchange',()=>{sessionReady=false;render()});render();
