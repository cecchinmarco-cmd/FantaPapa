const days=[
"Marco-Tomaso,Fabrizio-Alfonso,Paolo-Michele,Daniele-Cepe",
"Cepe-Marco,Michele-Daniele,Alfonso-Paolo,Tomaso-Fabrizio",

"Alfonso-Marco,Michele-Tomaso,Cepe-Fabrizio,Daniele-Paolo"];
days.push(...days.slice(0,7));
const scores=[[4,3,87,83.5],[5,0,94.5,65],[4,2,89.5,76],[1,3,70,78.5]];
const names=["Alfonso","Cepe","Daniele","Fabrizio","Marco","Michele","Paolo","Tomaso"];
const fmt=n=>n.toLocaleString("it-IT");
const phase=i=>i<7?"Andata":i<14?"Ritorno":"Campo neutro";
const matches=i=>days[i].split(",").map(s=>s.split("-"));
function matchCard(i,j,p){const s=i===0?scores[j]:null;return '<div class="match"><div class="matchline"><strong>'+p[0]+'</strong><b>'+ (s?s[0]+" – "+s[1]:"–")+'</b><strong>'+p[1]+'</strong></div>'+(s?'<div class="matchpoints">'+fmt(s[2])+' · '+fmt(s[3])+' fantapunti <small>· Bozza</small></div>':'')+'</div>'}
function calendar(){main.innerHTML='<h1 class="page-title">Calendario</h1><p class="subtle">21 giornate · 84 incontri · 3 gironi</p><div class="filters"><label>Giornata<select id="day"><option value="all">Tutte le giornate</option>'+days.map((_,i)=>'<option value="'+i+'">'+(i+1)+'ª giornata</option>').join('')+'</select></label><label>Fantallenatore<select id="manager"><option value="all">Tutti</option>'+names.map(n=>'<option>'+n+'</option>').join('')+'</select></label></div><div id="fixtures"></div>';const draw=()=>{let d=document.getElementById("day").value,m=document.getElementById("manager").value;document.getElementById("fixtures").innerHTML=days.map((_,i)=>{if(d!=="all"&&+d!==i)return "";return '<section class="round"><div class="sectionhead"><h2>'+(i+1)+'ª giornata</h2><small>'+phase(i)+' · Serie A '+(i+12)+'ª</small></div>'+matches(i).map((p,j)=>m==="all"||p.includes(m)?matchCard(i,j,p):"").join("")+'</section>'}).join("")};document.getElementById("day").onchange=draw;document.getElementById("manager").onchange=draw;draw()}
function standings(){const rows=names.map(n=>({n,p:0,g:0,v:0,x:0,l:0,gf:0,ga:0,ff:0,fa:0}));matches(0).forEach((p,j)=>{const s=scores[j];p.forEach((n,k)=>{const r=rows.find(x=>x.n===n);r.g++;r.gf=s[k];r.ga=s[1-k];r.ff=s[k+2];r.fa=s[3-k];r.v=+(r.gf>r.ga);r.x=+(r.gf===r.ga);r.l=+(r.gf<r.ga);r.p=3*r.v+r.x})});rows.sort((a,b)=>b.p-a.p||b.gf-a.gf||b.ff-a.ff||(b.gf-b.ga)-(a.gf-a.ga)||(b.ff-b.fa)-(a.ff-a.fa)||a.n.localeCompare(b.n));main.innerHTML='<h1 class="page-title">Classifica</h1><div class="notice"><strong>Classifica provvisoria</strong><br>Prima giornata in bozza, non ancora validata.</div><div class="tablewrap"><table><thead><tr>'+["Pos.","Fantallenatore","Pt","G","V","N","P","GF","GS","DF","FP fatti","FP subiti","Diff. FP"].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+[i+1,r.n,r.p,r.g,r.v,r.x,r.l,r.gf,r.ga,r.gf-r.ga,fmt(r.ff),fmt(r.fa),fmt(r.ff-r.fa)].map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="subtle">A pari punti: scontri diretti se disponibili; altrimenti fantagol fatti, fantapunti fatti, differenze. Media inglese da integrare dopo definizione completa.</p>'}

function formationView(){

main.innerHTML='<h1 class="page-title">Formazione</h1><div class="notice"><strong>Collaudo grafico interattivo</strong><br>Giocatori e statistiche dimostrativi. Nessun salvataggio reale.</div><div class="filters"><label>Giornata<select id="formDay">'+days.map((_,i)=>'<option value="'+i+'" '+(i===1?'selected':'')+'>'+(i+1)+'ª giornata · Serie A '+(i+12)+'</option>').join('')+'</select></label></div><p class="subtle">Scadenza da verificare. Trascina la maniglia ⋮⋮ per cambiare la priorità. Da tastiera usa le frecce su e giù sulla maniglia.</p><div class="sectionhead"><h2>Priorità dei moduli</h2></div><div id="moduleList" class="sortList"></div><div id="playerLists"></div><div class="formationLegend"><span><b class="presence starter">T</b> Titolare con voto · <b class="presence sub">S</b> Subentrato con voto</span><span><b class="presence absent">–</b> Non entrato · <b class="presence noVote">T</b> <b class="presence noVote">S</b> Senza voto</span><span><b class="fmBox up">7,50</b> In crescita <b class="fmBox down">6,50</b> In calo <b class="fmBox flat">7,00</b> Invariata</span></div><div class="sectionhead"><h2>Eccezioni tattiche</h2></div><div class="notice">'+["Difesa","Centrocampo","Attacco"].map(n=>'<label class="exception"><input type="checkbox"> '+n+' — valuta modulo senza riserva</label>').join('')+'<p class="subtle">Nessuna eccezione senza cambio per i portieri.</p></div><button class="primary" disabled style="opacity:.5;margin-top:20px">Salva formazione</button><p id="sortStatus" class="srOnly" aria-live="polite"></p>';
const playerLists=document.getElementById("playerLists");
playerLists.innerHTML=samples.map((g,i)=>'<div class="sectionhead"><h2>'+g.role+'</h2><small>'+g.players.length+'</small></div><div class="playerHead"><span></span><span>Calciatore</span><span>Ultime 5</span><span>FM</span><span>FM5</span></div><div class="sortList" id="role'+i+'"></div>').join("");
const handle=(name,i)=>'<button type="button" class="grip" aria-label="Sposta '+name+', posizione '+(i+1)+'" data-index="'+i+'">⠿</button>';
const decimal=x=>x.toFixed(2).replace(".",",");
function mount(list,arr,row){let active=null,raf=0;
function draw(focus){list.innerHTML=arr.map((x,i)=>'<div class="sortable" data-index="'+i+'">'+row(x,i)+'</div>').join("");if(focus!==undefined)list.querySelectorAll(".grip")[focus]?.focus()}
function move(a,b,focus){if(a===b)return;const [x]=arr.splice(a,1);arr.splice(b,0,x);draw(focus?b:undefined);document.getElementById("sortStatus").textContent="Spostato in posizione "+(b+1)}
function target(y){const rows=[...list.children];let i=rows.findIndex(el=>y<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);return i===-1?rows.length-1:Math.max(0,i>active.from?i-1:i)}
function mark(){if(!active)return;list.querySelectorAll(".dropTarget").forEach(el=>el.classList.remove("dropTarget"));active.to=target(active.y);list.children[active.to]?.classList.add("dropTarget")}
function tick(){if(!active)return;const y=active.y,vh=window.innerHeight;const speed=y<100?-Math.min(18,(100-y)/5):y>vh-110?Math.min(18,(y-vh+110)/5):0;if(speed){window.scrollBy(0,speed);mark()}raf=requestAnimationFrame(tick)}
list.addEventListener("pointerdown",e=>{const b=e.target.closest(".grip");if(!b||active||e.button!==0)return;e.preventDefault();active={from:+b.dataset.index,to:+b.dataset.index,y:e.clientY,id:e.pointerId,b};b.setPointerCapture(e.pointerId);b.closest(".sortable").classList.add("dragging");mark();raf=requestAnimationFrame(tick)});
list.addEventListener("pointermove",e=>{if(!active||e.pointerId!==active.id)return;active.y=e.clientY;mark()});
function finish(e,commit){if(!active||e.pointerId!==active.id)return;const a=active;active=null;cancelAnimationFrame(raf);list.querySelectorAll(".dragging,.dropTarget").forEach(el=>el.classList.remove("dragging","dropTarget"));if(commit)move(a.from,a.to,false)}
list.addEventListener("pointerup",e=>finish(e,true));list.addEventListener("pointercancel",e=>finish(e,false));list.addEventListener("lostpointercapture",e=>finish(e,false));
list.addEventListener("keydown",e=>{const b=e.target.closest(".grip");if(!b||!["ArrowUp","ArrowDown","Home","End"].includes(e.key))return;e.preventDefault();const i=+b.dataset.index;const j=e.key==="Home"?0:e.key==="End"?arr.length-1:Math.max(0,Math.min(arr.length-1,i+(e.key==="ArrowUp"?-1:1)));move(i,j,true)});draw()}
mount(document.getElementById("moduleList"),modules,(m,i)=>'<div class="moduleGrip">'+handle(m,i)+'<span>'+(i+1)+'.</span><strong>'+m+'</strong></div>');
samples.forEach((g,k)=>mount(document.getElementById("role"+k),g.players,(p,i)=>{const f=decimal(p.fm),f5=decimal(p.f5),trend=Number(p.f5.toFixed(2))-Number(p.fm.toFixed(2));return '<div class="playerGrid">'+handle(p.name,i)+'<div class="playerName"><strong>'+(i+1)+'. '+p.name+' ('+p.team+')</strong><small>'+p.opponent+'</small></div><div class="presenceGroup">'+p.history.map(q=>'<span class="presence '+(q.sv?'noVote':q.s==='T'?'starter':q.s==='S'?'sub':'absent')+'" aria-label="'+(q.s==="T"?"Titolare":q.s==="S"?"Subentrato":"Non entrato")+(q.sv?", senza voto":"")+'">'+q.s+'</span>').join("")+'</div><span class="fmNumber">'+f+'</span><span class="fmBox '+(trend>0?"up":trend<0?"down":"flat")+'" aria-label="'+(trend>0?"In crescita":trend<0?"In calo":"Invariata")+' '+f5+'">'+f5+'</span></div>'}));
}

function rulesView(){const sections=[["Campionato","8 fantallenatori, 21 giornate: andata e ritorno con fattore campo +2; terzo girone in campo neutro. Vittoria 3 punti, pareggio 1, sconfitta 0."],["Fasce gol","Meno di 66: 0 gol. Da 66 a 71,5: 1 gol. Da 72 a 77,5: 2 gol. Da 78 a 83,5: 3 gol. Un gol in più ogni 6 fantapunti."],["Rose e moduli","25 giocatori: 3 portieri, 8 difensori, 8 centrocampisti, 6 attaccanti. Moduli: 3-4-3, 4-3-3, 4-4-2, 3-5-2, 5-3-2, 4-5-1, 5-4-1."],["Formazioni e sostituzioni","Priorità ai titolari reali e ai moduli con copertura di reparto; in mancanza di copertura, precedenza ad attacco, centrocampo e difesa. Successivamente subentrati con voto. Due cambi migliorativi in ruoli distinti. Eccezioni tattiche da configurare."],["Bonus e malus","Gol +3; assist +1; autorete −1; gol subito dal portiere −1; ammonizione −0,5; espulsione −1; rigore sbagliato −3; rigore non subito dal portiere +3 anche se fuori bersaglio. Nessun bonus imbattibilità."],["Classifica","Punti; in caso di parità, confronto diretto: punti, fantagol fatti, fantapunti fatti, differenza fantagol, differenza fantapunti, media inglese. Se non vi sono scontri diretti, criteri complessivi: fantagol fatti, fantapunti fatti, differenza fantagol, differenza fantapunti, media inglese."],["Playoff","Quarti: 1ª–8ª, 2ª–7ª, 3ª–6ª, 4ª–5ª. Gara unica sui fantapunti, con vantaggio pari alla differenza dei punti in classifica. Parità a favore della meglio classificata."],["Montepremi","Quota 25 euro, montepremi previsto 200 euro. Premi: 125, 50 e 25 euro."]];main.innerHTML='<h1 class="page-title">Regole di lega</h1><p class="subtle">Riepilogo di lavoro · non sostituisce il regolamento completo da convalidare.</p>'+sections.map(x=>'<details class="rule"><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>').join('')}
async function adminView(){main.innerHTML='<h1 class="page-title">Amministrazione</h1><div class="notice" id="adminStatus">Verifica autorizzazione…</div>';const panel=document.getElementById("adminStatus");try{const res=await fetch("/api/auth/me",{cache:"no-store"});if(!res.ok)throw Error();const state=await res.json();if(!panel.isConnected)return;if(state.user?.role!=="admin"){panel.innerHTML='Area riservata all’amministratore. <a href="#accessi">Vai agli accessi</a>';return}await permissionPanel(panel)}catch{panel.textContent="Impossibile verificare le autorizzazioni."}}


async function permissionPanel(panel){
const res=await fetch("/api/auth/permissions",{cache:"no-store"});if(!res.ok)throw Error("Permessi non disponibili");const data=await res.json();if(!panel.isConnected)return;
const labels={"calendario":"Calendario","classifica":"Classifica","rose":"Rose","statistiche":"Statistiche","formazioni-altrui":"Formazioni altrui","what-if":"What If","archivio":"Archivio giornate","albo":"Albo d’oro","precedenti":"Precedenti e record","montepremi":"Montepremi","regole":"Regole di lega","accessi":"Registro accessi"};
const checked=(level,section)=>{const v=data.visibility.find(x=>x.level===level&&x.section===section);return v?!!v.allowed:!["accessi","formazioni-altrui"].includes(section)};
panel.innerHTML='<h2>Accessi e permessi</h2><p>Marco · Livello 3 · Controllo totale</p><p class="subtle">Livello 1: propria formazione. Livello 2: anche formazioni altrui. Livello 3: amministratore.</p><div id="accountList">'+data.players.map(p=>'<details class="rule"><summary>'+p.username+' · '+(p.created?'L'+p.level+(p.enabled?' · Attivo':' · Disattivato'):'Da attivare')+'</summary><form class="accessform accountForm" data-user="'+p.username+'"><label>Livello<select name="level"><option value="1" '+(p.level===1?'selected':'')+'>1 — Fantallenatore</option><option value="2" '+(p.level===2?'selected':'')+'>2 — Collaboratore</option></select></label><label class="exception"><input type="checkbox" name="enabled" '+(p.enabled?'checked':'')+'> Accesso attivo</label><label>'+(p.created?'Nuova password (facoltativa)':'Password iniziale')+'<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" '+(p.created?'':'required')+'></label><button type="submit" class="primary">Salva account</button><p role="status"></p></form></details>').join("")+'</div><h2>Visibilità per livello</h2><div class="permissionTable"><div class="permissionRow"><strong>Sezione</strong><strong>L1</strong><strong>L2</strong><strong>L3</strong></div>'+data.sections.map(s=>'<div class="permissionRow"><span>'+labels[s]+'</span>'+[1,2].map(l=>'<input type="checkbox" aria-label="'+labels[s]+' livello '+l+'" data-level="'+l+'" data-section="'+s+'" '+(checked(l,s)?'checked':'')+'>').join("")+'<span aria-label="Sempre consentito">✓</span></div>').join("")+'</div><p id="permissionStatus" role="status"></p><p class="subtle">Le impostazioni vengono salvate subito. L’applicazione alle singole sezioni sarà completata insieme alle API protette.</p>';
async function save(route,body){const r=await fetch("/api/auth/"+route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||"Salvataggio non riuscito")}
panel.querySelectorAll("input[data-level]").forEach(c=>c.onchange=async()=>{const status=panel.querySelector("#permissionStatus"),allowed=c.checked;c.disabled=true;try{await save("visibility",{level:+c.dataset.level,section:c.dataset.section,allowed});status.textContent="Permesso salvato."}catch(e){c.checked=!allowed;status.textContent=e.message}finally{c.disabled=false}});
panel.querySelectorAll(".accountForm").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector("button"),status=f.querySelector('[role="status"]'),b={username:f.dataset.user,level:+f.elements.level.value,enabled:f.elements.enabled.checked};if(f.elements.password.value)b.password=f.elements.password.value;btn.disabled=true;try{await save("account",b);f.elements.password.value="";await permissionPanel(panel)}catch(e){status.textContent=e.message;btn.disabled=false}})
}

const all=groups.flatMap(g=>g[1]),drawer=document.getElementById("drawer"),toggle=document.getElementById("toggle"),main=document.getElementById("main");document.getElementById("groups").innerHTML=groups.map(g=>'<div><h3>'+g[0]+'</h3>'+g[1].map(x=>'<a href="#'+x[0]+'">'+x[1]+'</a>').join('')+'</div>').join('');function menu(open){drawer.hidden=!open;toggle.setAttribute("aria-expanded",String(open));if(open)window.scrollTo(0,0)}toggle.onclick=()=>menu(drawer.hidden);document.getElementById("more").onclick=()=>menu(drawer.hidden);const tile=x=>'<a class="tile" href="#'+x[0]+'"><span aria-hidden="true">'+x[2]+'</span>'+x[1]+'</a>';function render(){const id=location.hash.slice(1)||"home",item=all.find(x=>x[0]===id)||all[0];menu(false);document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+item[0]?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(item[0]==='home'){main.innerHTML='<div class="hero"><div class="eyebrow">FantaPapa · 2026/27</div><h1>Il nostro<br>campionato.</h1><p>8 fantallenatori · 21 giornate · Playoff</p><a class="primary" href="#formazione">La mia formazione →</a></div><div class="sectionhead"><h2>Campionato</h2><a href="#calendario">Calendario →</a></div><div class="notice"><strong>2ª giornata FantaPapa</strong><br>13ª giornata di Serie A · Scadenza da confermare.</div><div class="sectionhead"><h2>Accesso rapido</h2></div><div class="cards">'+["calendario","classifica","rose","statistiche","playoff","what-if","albo","precedenti"].map(k=>tile(all.find(x=>x[0]===k))).join('')+'</div>'}else if(item[0]==="calendario"){calendar()}else if(item[0]==="classifica"){standings()}else if(item[0]==="formazione"){formationView()}else if(item[0]==="playoff"){playoffView()}else if(item[0]==="albo"||item[0]==="precedenti"){historyView(item[0])}else if(item[0]==="montepremi"){prizeView()}else if(item[0]==="what-if"||item[0]==="archivio"){archiveView(item[0]==="what-if")}else if(item[0]==="regole"){rulesView()}else if(item[0]==="amministrazione"){adminView()}else if(item[0]==="accessi"){accessView()}else if(item[0]==="rose"){rosterView(false)}else if(item[0]==="statistiche"){rosterView(true)}else{main.innerHTML='<p class="subtle">FantaPapa 2026/27</p><h1 class="page-title">'+item[1]+'</h1><div class="notice"><strong>Sezione in preparazione</strong><p>Questa pagina sarà attivata dopo il caricamento e la verifica dei dati. Nessun dato simulato.</p><a href="#home">Torna alla Home</a></div>'}main.insertAdjacentHTML('beforeend','<footer>FantaPapa · Versione accessi 05</footer>');window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
